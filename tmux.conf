# improve colors
set -g default-terminal 'tmux-256color'
set -ag terminal-overrides ',*:RGB'

set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',*:clipboard'
set -ag terminal-features 'xterm-kitty:extkeys'

# act like vim
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection to clipboard" -T copy-mode-vi y send -X copy-pipe-and-cancel 'wl-copy'

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# prefix — C-z (primary, existing muscle memory) + C-Space (secondary, from Omarchy)
unbind C-b
set -g prefix C-z
set -g prefix2 C-Space
bind -N "Send prefix" C-Space send-prefix

# start window numbers at 1 to match keyboard order with tmux window order
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# move system clipboard into tmux paste buffer
bind C-p run-shell -b "tmux set-buffer \"$(wl-paste -n)\"; tmux paste-buffer"
# move tmux copy buffer into system clipboard
bind C-y run-shell -b "tmux save-buffer - | wl-copy"

# status bar
set -g status-position bottom
set -g status-interval 5
set -g set-titles on
set -g set-titles-string '#h:#W'
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# ── Yendo Cowboy color scheme ──
# Generated from config/yendo-cowboy/palette.yaml
set -g status-left-length 52
set -g status-right-length 451
set -g status-fg '#fff5e1'
set -g status-bg '#1a0f0a'
set -g pane-border-style fg='#a0522d'
set -g pane-active-border-style fg='#e87530'
set -g message-style fg='#1a0f0a'
set -g message-style bg='#f5a623'
set -g message-style bold

set -g status-left '#[fg=#1a0f0a,bg=#e87530,bold]  #S  #[fg=#e87530,bg=#1a0f0a]  '
set -g status-right '#[fg=#a0522d,bg=default]#[fg=#1a0f0a,bg=#a0522d] %d %b • %R '
set -g window-status-format '#[fg=#a0522d,bg=#2d1810] #I • #W '
set -g window-status-current-format '#[fg=#1a0f0a,bg=#e87530,bold] #I • #W '
set -g window-status-separator ''

# No escape time for vi mode
set -sg escape-time 0

# Bigger history
set -g history-limit 50000

# allow terminal to handle paste events and image passthrough directly
set -g allow-passthrough on
set -g focus-events on
set -g set-clipboard on
setw -g aggressive-resize on
set -g detach-on-destroy off

# switch to last pane
bind-key C-a last-pane

# Status Bar ---------------------
# (colors set above in Yendo Cowboy scheme)
set -g status on

# Allow mouse usage
set -g mouse on

# Shift + arrows to resize pane
bind -n S-Left resize-pane -L 2
bind -n S-Right resize-pane -R 2
bind -n S-Down resize-pane -D 1
bind -n S-Up resize-pane -U 1

# Ctrl+Meta+Shift+arrows for larger resize steps (from Omarchy)
bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Ctrl+Meta+arrows for pane focus (from Omarchy)
bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# smart pane switching with awareness of vim splits
#is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
#bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
#bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
#bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
#bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
#bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

#vi style selection and copying to clipboard
# bind-key -T vi-copy v begin-selection
# bind-key -T vi-copy y copy-pipe "reattach-to-user-namespace pbcopy"

# Update default binding of `Enter` to also use copy-pipe
# unbind -T vi-copy Enter
# bind-key -T vi-copy Enter copy-pipe "reattach-to-user-namespace pbcopy"

#copy paste to clipboard
#set-option -g default-command "reattach-to-user-namespace -l zsh" # or bash...
#bind C-c run "tmux save-buffer - | reattach-to-user-namespace pbcopy"
#bind C-v run "reattach-to-user-namespace pbpaste | tmux load-buffer - && tmux paste-buffer"

bind-key r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

bind-key h split-window -v -c '#{pane_current_path}'
bind-key v split-window -h -c '#{pane_current_path}'

bind-key c new-window -c '#{pane_current_path}'
bind-key k confirm kill-window

# Quickly edit todo list
bind-key t split-window -h "vim"

bind-key K run-shell 'tmux switch-client -n \; kill-session -t "$(tmux display-message -p "#S")" || tmux kill-session'

# Session navigation (from Omarchy)
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n
bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# Window navigation without prefix (from Omarchy)
bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# source "/usr/share/tmux/powerline.conf

# List of plugins
set -g @plugin 'tmux-plugins/tpm' # Tmux package manager
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-open' # Open highlighted selection directly from Tmux
set -g @plugin 'tmux-plugins/tmux-resurrect' # Restore previous sessions on reboot
set -g @plugin 'tmux-plugins/tmux-continuum' # Restore previous sessions on reboot
# set -g @plugin 'tmux-plugins/tmux-battery' #Show battery icon/status

# Tmux will auto-start on system boot
set -g @continuum-boot 'on'
# Linux/systemd only starts the tmux server; terminal-emulator boot options are macOS-specific.
set -gu @continuum-boot-options
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'
#set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session' #for Neo Vim
# Restore only safe foreground commands. tmux-resurrect re-runs commands; it does not checkpoint process state.
set -g @resurrect-processes '"~btop" "~yazi" "~hermes --resume [^ ]+ --yolo"'

# How to install other plugins from Github:
# To install new plugins press: prefix + I
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com/user/plugin'
# set -g @plugin 'git@bitbucket.com/user/plugin'


# Initializes Tmux plugin manager.
# Keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
