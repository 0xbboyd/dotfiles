- clean: ["~"]

- shell:
    - "git submodule update --init --recursive external/gws"
    - "git submodule update --init --recursive external/antigen"
    - "mkdir -p ~/src"
    - "mkdir -p ~/.config"
    - "mkdir -p ~/.config/i3 ~/.config/polybar ~/.config/rofi ~/.config/flameshot ~/.config/autorandr ~/.config/herdr ~/.config/sway ~/.config/waybar"
    - "mkdir -p ~/.config/k9s/skins"
    - "mkdir -p ~/.config/environment.d ~/.config/gtk-3.0 ~/.config/gtk-4.0 ~/.config/qutebrowser ~/.config/wallpapers"
    - "mkdir -p ~/.config/fontconfig/conf.d ~/.config/foot ~/.config/ghostty ~/.config/btop"
    - "mkdir -p ~/.screenlayout"
    - "mkdir -p ~/.local/bin"
    - "mkdir -p ~/.local/share"
    - "mkdir -p ~/.local/share/applications ~/.local/share/qutebrowser/userscripts"
    - "mkdir -p ~/.local/tools"
    - "mkdir -p ~/.vim/autoload ~/.vim/bundle ~/.vim/backups ~/.vim/swaps"
    - "rm ~/.profile"
    - "rm ~/.aliases"
    - "rm ~/.gitignore_global"
    - "rm ~/.gitconfig"
    - "rm ~/.wgetrc"
    - "rm ~/.curlrc"
    - "rm ~/.psqlrc"
    - "rm ~/.tmux.conf"
    - "rm ~/.tmuxinator"
    - "rm ~/.zshrc"
    - "rm ~/.vimrc"
    - "rm ~/.p10k.zsh"

- link:
    # dotfiles
    "~/.aliases": "aliases"
    "~/.profile": "profile"
    "~/.gitignore_global": "gitignore_global"
    "~/.gitconfig": "gitconfig"
    "~/.wgetrc": "wgetrc"
    "~/.curlrc": "curlrc"
    "~/.psqlrc": "psqlrc"
    "~/.tmux.conf": "tmux.conf"
    "~/.tmuxinator": "tmuxinator"
    "~/.zshrc": "zshrc"
    "~/.vimrc": "vimrc"
    "~/.p10k.zsh": "p10k.zsh"

    # tools / scripts
    "~/.local/bin/gws": "external/gws/src/gws"
    "~/.local/bin/git_delete_stale_branches": "scripts/commands/git_delete_stale_branches.sh"
    "~/.local/bin/git-hermes-commit-message": "scripts/commands/git_hermes_commit_message.sh"
    "~/.local/bin/clip-image": "scripts/commands/clip_image.sh"
    "~/.local/bin/nix-updates-check": "scripts/commands/nix-updates-check.sh"
    "~/.local/bin/nix-updates-dismiss": "scripts/commands/nix-updates-dismiss.sh"

    # other config
    "~/src/.projects.gws": "src/projects.gws"
    "~/.config/nvim": "config/nvim"
    "~/.wezterm.lua": "config/wezterm.lua"
    "~/.config/herdr/config.toml": "config/herdr/config.toml"
    "~/.config/k9s/skins/yendo-cowboy.yaml": "config/k9s/skins/yendo-cowboy.yaml"

    # desktop / i3 environment
    "~/.config/i3/config": "config/i3/config"
    "~/.config/i3/scripts/lock.sh": "config/i3/scripts/lock.sh"
    "~/.config/i3/scripts/bluetooth-audio-picker.sh": "config/i3/scripts/bluetooth-audio-picker.sh"
    "~/.config/polybar/config.ini": "config/polybar/config.ini"
    "~/.config/polybar/launch.sh": "config/polybar/launch.sh"
    "~/.config/rofi/config.rasi": "config/rofi/config.rasi"
    "~/.config/flameshot/flameshot.ini": "config/flameshot/flameshot.ini"
    "~/.screenlayout/auto.sh": "screenlayout/auto.sh"
    "~/.screenlayout/layout.sh": "screenlayout/layout.sh"
    "~/.screenlayout/apply-desktop.sh": "screenlayout/apply-desktop.sh"
    "~/.config/autorandr": "config/autorandr"
    "~/.config/gtk-3.0/settings.ini": "config/gtk-3.0/settings.ini"
    "~/.config/gtk-4.0/settings.ini": "config/gtk-4.0/settings.ini"
    "~/.gtkrc-2.0": "gtkrc-2.0"
    "~/.config/environment.d/gtk-dark.conf": "config/environment.d/gtk-dark.conf"
    "~/.config/environment.d/nix-path.conf": "config/environment.d/nix-path.conf"
    "~/.local/share/applications/org.gnome.Nautilus.desktop": "local/share/applications/org.gnome.Nautilus.desktop"
    "~/.config/wallpapers/pixel-frontier-sunset-stockcake-1680x1050-focal.jpg": "config/wallpapers/pixel-frontier-sunset-stockcake-1680x1050-focal.jpg"

    # desktop / sway environment (side-by-side with i3, selectable at GDM login)
    "~/.config/sway/config": "config/sway/config"
    "~/.config/waybar/config": "config/waybar/config"
    "~/.config/waybar/style.css": "config/waybar/style.css"

    # qutebrowser integration
    "~/.config/qutebrowser/config.py": "config/qutebrowser/config.py"
    "~/.local/share/qutebrowser/userscripts/qute-1password-okta": "local/share/qutebrowser/userscripts/qute-1password-okta"

    # Omarchy-ported configs (see docs/omarchy-integration.md)
    "~/.config/fontconfig/conf.d/50-omarchy-fonts.conf": "config/fontconfig/conf.d/50-omarchy-fonts.conf"
    "~/.config/starship.toml": "config/starship.toml"
    "~/.config/btop/btop.conf": "config/btop/btop.conf"
    "~/.config/foot/foot.ini": "config/foot/foot.ini"
    "~/.config/ghostty/config": "config/ghostty/config"

    # Omarchy-ported scripts (see docs/omarchy-integration.md)
    "~/.local/bin/notify": "scripts/commands/notify.sh"
    "~/.local/bin/reminder": "scripts/commands/reminder.sh"
    "~/.local/bin/audio-volume": "scripts/commands/audio/volume.sh"
    "~/.local/bin/audio-mute": "scripts/commands/audio/mute.sh"
    "~/.local/bin/audio-output-switch": "scripts/commands/audio/output-switch.sh"
    "~/.local/bin/audio-output-sink": "scripts/commands/audio/output-sink.sh"
    "~/.local/bin/brightness": "scripts/commands/brightness.sh"
    "~/.local/bin/kbd-brightness": "scripts/commands/kbd-brightness.sh"
    "~/.local/bin/battery-status": "scripts/commands/battery.sh"
    "~/.local/bin/battery-present": "scripts/commands/battery-present.sh"
    "~/.local/bin/battery-low": "scripts/commands/battery-low.sh"
    "~/.local/bin/screenshot": "scripts/commands/screenshot.sh"
    "~/.local/bin/ocr-screenshot": "scripts/commands/ocr-screenshot.sh"
    "~/.local/bin/qr-screenshot": "scripts/commands/qr-screenshot.sh"

