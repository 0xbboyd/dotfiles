- clean: ["~"]

- shell:
    - "git submodule update --init --recursive external/gws"
    - "git submodule update --init --recursive external/antigen"
    - "mkdir -p ~/src"
    - "mkdir -p ~/.config"
    - "mkdir -p ~/.config/i3 ~/.config/polybar ~/.config/rofi ~/.config/flameshot ~/.config/autorandr"
    - "mkdir -p ~/.config/gtk-3.0 ~/.config/gtk-4.0 ~/.config/environment.d ~/.config/qutebrowser ~/.config/wallpapers"
    - "mkdir -p ~/.screenlayout"
    - "mkdir -p ~/.local/bin"
    - "mkdir -p ~/.local/share"
    - "mkdir -p ~/.local/share/applications ~/.local/share/qutebrowser/userscripts"
    - "mkdir -p ~/.local/tools"
    - "mkdir -p ~/.vim/autoload ~/.vim/bundle ~/.vim/backups ~/.vim/swaps"
    - "rm ~/.profile"
    - "rm ~/.aliases"
    - "rm ~/.gitignore_global"
    - "rm ~/.gitconfig"
    - "rm ~/.wgetrc"
    - "rm ~/.curlrc"
    - "rm ~/.psqlrc"
    - "rm ~/.tmux.conf"
    - "rm ~/.tmuxinator"
    - "rm ~/.zshrc"
    - "rm ~/.vimrc"
    - "rm ~/.p10k.zsh"

- link:
    # dotfiles
    "~/.aliases": "aliases"
    "~/.profile": "profile"
    "~/.gitignore_global": "gitignore_global"
    "~/.gitconfig": "gitconfig"
    "~/.wgetrc": "wgetrc"
    "~/.curlrc": "curlrc"
    "~/.psqlrc": "psqlrc"
    "~/.tmux.conf": "tmux.conf"
    "~/.tmuxinator": "tmuxinator"
    "~/.zshrc": "zshrc"
    "~/.vimrc": "vimrc"
    "~/.p10k.zsh": "p10k.zsh"

    # tools / scripts
    "~/.local/bin/gws": "external/gws/src/gws"
    "~/.local/bin/git_delete_stale_branches": "scripts/commands/git_delete_stale_branches.sh"
    "~/.local/bin/clip-image": "scripts/commands/clip_image.sh"

    # other config
    "~/src/.projects.gws": "src/projects.gws"
    "~/.config/nvim": "config/nvim"
    "~/.wezterm.lua": "config/wezterm.lua"

    # desktop / i3 environment
    "~/.config/i3/config": "config/i3/config"
    "~/.config/polybar/config.ini": "config/polybar/config.ini"
    "~/.config/polybar/launch.sh": "config/polybar/launch.sh"
    "~/.config/rofi/config.rasi": "config/rofi/config.rasi"
    "~/.config/flameshot/flameshot.ini": "config/flameshot/flameshot.ini"
    "~/.screenlayout/auto.sh": "screenlayout/auto.sh"
    "~/.config/autorandr": "config/autorandr"
    "~/.config/gtk-3.0/settings.ini": "config/gtk-3.0/settings.ini"
    "~/.config/gtk-4.0/settings.ini": "config/gtk-4.0/settings.ini"
    "~/.gtkrc-2.0": "gtkrc-2.0"
    "~/.config/environment.d/gtk-dark.conf": "config/environment.d/gtk-dark.conf"
    "~/.local/share/applications/org.gnome.Nautilus.desktop": "local/share/applications/org.gnome.Nautilus.desktop"
    "~/.config/wallpapers/pixel-frontier-sunset-stockcake.jpg": "config/wallpapers/pixel-frontier-sunset-stockcake.jpg"

    # qutebrowser integration
    "~/.config/qutebrowser/config.py": "config/qutebrowser/config.py"
    "~/.local/share/qutebrowser/userscripts/qute-1password-okta": "local/share/qutebrowser/userscripts/qute-1password-okta"

