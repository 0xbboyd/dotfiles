# Starship prompt config — Yendo Cowboy powerline style
# Matches p10k rainbow aesthetic: colored segments with powerline separators,
# two-line layout, box-drawing prompt character.
# Uses DejaVuSansM Nerd Font Mono powerline glyphs:
#   \ue0b0 = right-pointing triangle (segment transition left->right)
#   \ue0b2 = left-pointing triangle (right-side segment transition)

# ── Global ──
add_newline = true
command_timeout = 200

# Two-line prompt: info on line 1, prompt char on line 2.
format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$jobs\
$line_break\
$character"""

# ── Prompt character (line 2) ──
[character]
success_symbol = "[\u256e\u2500\u276f](fg:#f5a623)"
error_symbol = "[\u256e\u2500\u2717](fg:#ef5350)"

# ── Directory — orange segment with powerline tail ──
# \ue0b0 = right-pointing triangle: fg=segment bg, bg=next segment bg
[directory]
style = "fg:#1a0f0a bg:#e87530 bold"
format = "[ $path ]($style)[\ue0b0](fg:#e87530 bg:#2d1810)"
truncation_length = 3
truncation_symbol = "\u2026/"
repo_root_style = "fg:#1a0f0a bg:#e87530 bold"
repo_root_format = "[ $repo_root ]($repo_root_style)[\ue0b0](fg:#e87530 bg:#2d1810)[$path]($style)"

# ── Git branch — dark brown segment ──
[git_branch]
style = "fg:#fff5e1 bg:#2d1810"
format = "[ $symbol$branch ]($style)[\ue0b0](fg:#2d1810 bg:#1a0f0a)"
symbol = ""

# ── Git status — darkest segment, continues from branch ──
# Final \ue0b0 closes the segment back to terminal default
[git_status]
style = "fg:#fff5e1 bg:#1a0f0a"
format = "[ $all_status$ahead_behind]($style)[\ue0b0](fg:#1a0f0a)"
ahead = "\u21e1${count} "
behind = "\u21e3${count} "
diverged = "\u21d5\u21e1${ahead_count}\u21e3${behind_count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

# ── Fill — pushes right-side modules to the right edge ──
[fill]
symbol = "\u2500"
style = "fg:#a0522d"

# ── Command duration — amber segment (right side) ──
# \ue0b2 = left-pointing triangle: fg=prev bg, bg=segment bg
[cmd_duration]
style = "fg:#1a0f0a bg:#f5a623"
format = "[\ue0b2](fg:#a0522d bg:#f5a623)[ $duration ]($style)"
min_time = 3_000
show_milliseconds = false

# ── Background jobs ──
[jobs]
style = "fg:#f5a623 bg:#1a0f0a"
format = "[\ue0b2](fg:#a0522d bg:#1a0f0a)[ $symbol$number ]($style)"
symbol = ""

# ── Kubernetes context ──
# Disabled by default — p10k showed it only when running k8s commands.
# Starship can't do conditional display, so enable manually if wanted.
[kubernetes]
style = "fg:#1a0f0a bg:#ad8ee6"
format = "[\ue0b2](fg:#a0522d bg:#ad8ee6)[ \u2388 $context ]($style)"
disabled = true

# ── Line break — separates line 1 from line 2 ──
[line_break]
disabled = false
