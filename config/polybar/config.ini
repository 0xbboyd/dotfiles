; Yendo Cowboy Powerline Polybar
; Palette source: ~/src/dotfiles/config/yendo-cowboy/palette.yaml

[colors]
bg = #1a0f0a
bg_darker = #0d0704
bg_mid = #2d1810
bg_tertiary = #3d1e0f
fg = #fff5e1
primary = #e87530
accent = #f5a623
border = #c4522a
ok = #4caf50
error = #ef5350
dim = #8b4513
muted = #a0522d
transparent = #00000000

[bar/yendo]
monitor = ${env:MONITOR:}
width = 100%
height = 28
radius = 0
fixed-center = true
bottom = false
background = ${colors.transparent}
foreground = ${colors.fg}
line-size = 2
line-color = ${colors.primary}
border-size = 0
padding-left = 0
padding-right = 0
module-margin-left = 0
module-margin-right = 0
font-0 = DejaVu Sans Mono:size=10;2
font-1 = PowerlineSymbols:size=13;3
modules-left = i3 left-cap
modules-center =
modules-right = sep-network network sep-cpu cpu sep-memory memory sep-pulseaudio pulseaudio sep-battery battery sep-date date
enable-ipc = true
override-redirect = false

[bar/yendo-primary]
inherit = bar/yendo
; The tray should exist on exactly one X11 bar. launch.sh starts this bar only on the primary monitor.
modules-right = sep-network network tray sep-cpu cpu sep-memory memory sep-pulseaudio pulseaudio sep-battery battery sep-date date

[module/left-cap]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.bg_darker}
format-background = ${colors.transparent}

[module/right-cap]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.bg_darker}
format-background = ${colors.transparent}

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true
wrapping-scroll = false
format = <label-state> <label-mode>
format-background = ${colors.bg_darker}
format-foreground = ${colors.fg}
label-focused = " %name% "
label-focused-background = ${colors.primary}
label-focused-foreground = ${colors.bg}
label-focused-underline = ${colors.accent}
label-focused-padding = 1
label-unfocused = " %name% "
label-unfocused-background = ${colors.bg_darker}
label-unfocused-foreground = ${colors.fg}
label-unfocused-padding = 1
label-visible = " %name% "
label-visible-background = ${colors.bg_mid}
label-visible-foreground = ${colors.accent}
label-visible-padding = 1
label-urgent = " %name% "
label-urgent-background = ${colors.error}
label-urgent-foreground = ${colors.bg}
label-urgent-padding = 1
label-mode = " %mode% "
label-mode-background = ${colors.accent}
label-mode-foreground = ${colors.bg}
label-mode-padding = 1

[module/title]
type = internal/xwindow
format = <label>
format-background = ${colors.transparent}
format-foreground = ${colors.fg}
label = %title%
label-maxlen = 80
label-empty = ""

[module/network]
type = internal/network
interface = wlp0s20f3
interval = 5
format-connected = <label-connected>
format-connected-background = ${colors.bg_mid}
format-connected-foreground = ${colors.fg}
label-connected = " WLAN %essid% "
format-disconnected = <label-disconnected>
format-disconnected-background = ${colors.bg_mid}
format-disconnected-foreground = ${colors.muted}
label-disconnected = " WLAN down "

[module/tray]
type = internal/tray
format = <tray>
format-background = ${colors.bg_mid}
tray-spacing = 4px
tray-size = 66%

[module/sep-network]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.bg_mid}
format-background = ${colors.transparent}

[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-background = ${colors.bg_tertiary}
format-foreground = ${colors.fg}
label = " CPU %percentage%% "

[module/sep-cpu]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.bg_tertiary}
format-background = ${colors.bg_mid}

[module/memory]
type = internal/memory
interval = 5
format = <label>
format-background = ${colors.border}
format-foreground = ${colors.fg}
label = " MEM %percentage_used%% "

[module/sep-memory]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.border}
format-background = ${colors.bg_tertiary}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
format-volume-background = ${colors.primary}
format-volume-foreground = ${colors.bg}
label-volume = " VOL %percentage%% "
format-muted = <label-muted>
format-muted-background = ${colors.primary}
format-muted-foreground = ${colors.bg}
label-muted = " VOL muted "

[module/sep-pulseaudio]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.primary}
format-background = ${colors.border}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 10
format-charging = <label-charging>
format-charging-background = ${colors.accent}
format-charging-foreground = ${colors.bg}
label-charging = " BAT %percentage%%+ "
format-discharging = <label-discharging>
format-discharging-background = ${colors.accent}
format-discharging-foreground = ${colors.bg}
label-discharging = " BAT %percentage%% "
format-full = <label-full>
format-full-background = ${colors.accent}
format-full-foreground = ${colors.bg}
label-full = " BAT full "

[module/sep-battery]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.accent}
format-background = ${colors.primary}

[module/sep-date]
type = custom/text
format = ""
format-font = 2
format-foreground = ${colors.bg_darker}
format-background = ${colors.accent}

[module/date]
type = internal/date
interval = 1
time = %I:%M %p
format = <label>
format-background = ${colors.bg_darker}
format-foreground = ${colors.fg}
label = " %time% "

[settings]
screenchange-reload = true
pseudo-transparency = true
