[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "plugin lazygit"
desc = "run lazygit"

[[mgr.prepend_keymap]]
on   = "H"
run  = "plugin duckdb -1"
desc = "Scroll one column to the left (duckdb)"

[[mgr.prepend_keymap]]
on   = "L"
run  = "plugin duckdb +1"
desc = "Scroll one column to the right (duckdb)"

[[mgr.prepend_keymap]]
on   = [ "g", "o" ]
run  = "plugin duckdb -open"
desc = "Open with duckdb"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "plugin duckdb -ui"
desc = "Open with duckdb UI"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "c", "a", "g" ]
run  = "plugin compress tar.gz"
desc = "Archive selected files to tar.gz"
