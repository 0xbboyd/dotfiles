[mgr]
ratio = [1, 2, 5]

[opener]
edit = [
  { run = '${EDITOR:-nvim} "$@"', block = true, for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.md", use = "edit" },
  { mime = "text/markdown", use = "edit" },
  { mime = "text/plain", use = "edit" },
]

[plugin]
prepend_previewers = [
  { url = "*.csv",     run = "duckdb" },
  { url = "*.tsv",     run = "duckdb" },
  { url = "*.json",    run = "duckdb" },
  { url = "*.parquet", run = "duckdb" },
  { url = "*.txt",     run = "duckdb" },
  { url = "*.xlsx",    run = "duckdb" },
  { url = "*.db",      run = "duckdb" },
  { url = "*.duckdb",  run = "duckdb" },
]

prepend_preloaders = [
  { url = "*.csv",     run = "duckdb", multi = false },
  { url = "*.tsv",     run = "duckdb", multi = false },
  { url = "*.json",    run = "duckdb", multi = false },
  { url = "*.parquet", run = "duckdb", multi = false },
  { url = "*.txt",     run = "duckdb", multi = false },
  { url = "*.xlsx",    run = "duckdb", multi = false },
]
